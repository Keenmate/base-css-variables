name: Create release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Package and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No build step — base-variables.css is authored by hand and shipped as-is.
      - name: Package zip
        run: |
          VER="${GITHUB_REF_NAME#v}"
          ZIP="base-css-variables-${VER}.zip"
          zip -r "${ZIP}" \
            base-variables.css README.md CHANGELOG.md LICENSE
          sha256sum "${ZIP}" > "${ZIP}.sha256"
          ls -l "${ZIP}" "${ZIP}.sha256"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            base-css-variables-*.zip
            base-css-variables-*.zip.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
